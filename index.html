<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Cadence — workouts maison</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* VOICE: un coach d'app iOS — net, rassurant, zéro bruit ; en séance, il parle fort et clair.
   IDEA: l'app Forme d'Apple : listes groupées le jour, salle noire et anneaux lumineux pendant l'effort.
   PICTURE: la séance du jour en carte dégradée avec bouton lecture ; en séance, anneau de repos plein écran.
   COLOUR and TYPE: gris groupé iOS, cellules blanches, rouge vif comme teinte, jaune pour le repos ; SF Pro et SF Rounded pour les chiffres.
   LAYOUT: grand titre qui se replie dans une barre floutée, barre d'onglets translucide, feuilles modales, 2 colonnes au-delà de 900px. */
:root{color-scheme:light dark;--bg:light-dark(#f2f2f7,#000);--cell:light-dark(#fff,#1c1c1e);--fill:light-dark(rgba(118,118,128,.12),rgba(118,118,128,.24));--sep:light-dark(rgba(60,60,67,.22),rgba(84,84,88,.6));--ink:light-dark(#000,#fff);--mute:light-dark(rgba(60,60,67,.62),rgba(235,235,245,.6));--tint:light-dark(#e5372a,#ff4f3f);--tintbg:light-dark(rgba(229,55,42,.11),rgba(255,79,63,.2));--green:light-dark(#248a3d,#30d158);--danger:light-dark(#d70015,#ff453a);--yellow:#ffd60a;--bar:light-dark(rgba(249,249,251,.82),rgba(24,24,26,.82))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;letter-spacing:-.01em;overflow-x:clip;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
.rnd,.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
.nav{position:sticky;top:0;z-index:5;min-height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 8px 0 16px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;transition:background .2s}
.nav.sc{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.ntitle{font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap}.nav.sc .ntitle{opacity:1}
.nact{justify-self:end}
.sync{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px}
.sync.err{color:var(--danger)}
main{max-width:1000px;margin:0 auto;padding:0 16px 28px}
.lt h1{font-size:34px;font-weight:700;letter-spacing:.005em;margin:0;line-height:1.15}
.lt p{margin:2px 0 12px;color:var(--mute);font-size:15px}
.sec{font-size:13px;color:var(--mute);margin:24px 16px 7px}
.cols{display:grid;gap:0 20px}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.stack{display:grid;gap:12px}
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.group+.group{margin-top:12px}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;background:var(--cell);width:100%;border:0;text-align:left;color:inherit;font:inherit;text-decoration:none}
.cell+.cell::before,.cell+details.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
button.cell:active,a.cell:active,.cellbtn:active{background:var(--fill)}
.sub{display:block;font-size:14px;color:var(--mute);margin-top:1px}
.val{color:var(--mute);white-space:nowrap}
.chev{flex:none;width:8px;height:8px;border-right:2px solid var(--mute);border-top:2px solid var(--mute);transform:rotate(45deg);opacity:.55;margin:0 4px 0 2px}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cellbtn{flex:1;border:0;background:transparent;text-align:left;padding:0;min-height:44px;color:inherit;border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:0;border-radius:14px;background:var(--tint);color:#fff;font-weight:600;font-size:17px}
.btn:active{opacity:.75}
.btn.t{background:var(--tintbg);color:var(--tint)}
.btn.w{width:100%}
.lnk{background:none;border:0;color:var(--tint);font-size:17px;min-height:44px;padding:0 6px}
.lnk.b{font-weight:600}.lnk.d{color:var(--danger)}
.plus{width:44px;height:44px;border:0;background:none;color:var(--tint);display:grid;place-items:center}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--tintbg);color:var(--tint);display:grid;place-items:center;flex:none}
.minus{width:44px;height:44px;margin:-10px -8px -10px -12px;border:0;background:none;display:grid;place-items:center;flex:none}
.minus i{width:22px;height:22px;border-radius:50%;background:var(--danger);display:grid;place-items:center}.minus i::after{content:"";width:10px;height:2px;background:#fff;border-radius:1px}
.feat{border-radius:20px;padding:18px 88px 18px 18px;color:#fff;background:linear-gradient(140deg,#ff7a45 0%,#ef3f2d 45%,#c2182e 100%);position:relative;overflow:hidden;min-height:132px;box-shadow:0 10px 28px -10px rgba(229,55,42,.55)}
.feat::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;border:22px solid rgba(255,255,255,.12)}
.feat.goal{background:linear-gradient(140deg,#3a3a3c,#1c1c1e);box-shadow:0 10px 28px -12px rgba(0,0,0,.5)}
.feat.goal::after{border-color:rgba(255,79,63,.35)}
.feat.done{filter:saturate(.55);opacity:.85}
.feat .k{font-size:14px;opacity:.85;margin:0}
.feat h3{font-size:26px;font-weight:700;margin:2px 0 4px;line-height:1.1}
.feat .go{position:absolute;z-index:1;right:16px;bottom:16px;width:60px;height:60px;border-radius:50%;border:0;background:#fff;color:#e5372a;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.feat .go:active{transform:scale(.94)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;padding:12px 8px}
.wd{font-size:12px;color:var(--mute)}
.wn{display:grid;place-items:center;width:36px;height:36px;margin:4px auto 0;border-radius:50%;font-weight:600;font-size:17px}
.wn.today{background:var(--tint);color:#fff}
.wdot{display:block;width:6px;height:6px;border-radius:50%;margin:5px auto 0;border:1.5px solid transparent}
.wdot.plan{border-color:var(--tint)}.wdot.done{background:var(--tint);border-color:var(--tint)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1 0 auto;min-height:34px;border:0;background:transparent;border-radius:7px;font-size:13px;font-weight:500;padding:0 10px}
.seg button.on{background:var(--cell);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;min-height:40px;margin-bottom:10px;color:var(--mute)}
.search input{border:0;background:transparent;outline:none;font-size:17px;min-height:40px;width:100%;color:var(--ink)}
.rin{border:0;background:transparent;text-align:right;color:var(--mute);font-size:17px;max-width:55%;min-height:30px;padding:0;outline:none}
.rin:focus{color:var(--tint)}
select.rin{-webkit-appearance:none;appearance:none;text-align-last:right;padding-right:2px}
input.full{border:0;background:transparent;width:100%;min-height:30px;font-size:17px;outline:none}
.cell:focus-within{background:light-dark(#f7f7f9,#232325)}
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:99px;background:var(--fill);position:relative;flex:none;transition:background .2s;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08);transition:transform .2s}
.switch:checked{background:#34c759}.switch:checked::after{transform:translateX(20px)}
.dpick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:8px}
.dpick button{aspect-ratio:1;max-width:44px;width:100%;justify-self:center;border-radius:50%;border:0;background:var(--fill);font-weight:600;font-size:15px}
.dpick button.on{background:var(--tint);color:#fff}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.mini label{font-size:12px;color:var(--mute);text-align:center}
.mini input{display:block;width:100%;margin-top:4px;background:var(--fill);border:0;border-radius:9px;min-height:40px;text-align:center;font-size:17px;font-weight:600}
.ib{width:36px;height:36px;border:0;border-radius:50%;background:var(--fill);color:var(--ink);flex:none;font-size:15px}
.idx{width:26px;height:26px;border-radius:50%;background:var(--tint);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles>div{padding:14px 16px}.tiles>div+div{box-shadow:inset .5px 0 0 var(--sep)}
.tiles b{display:block;font-size:clamp(28px,8vw,36px);font-weight:700;color:var(--tint);line-height:1.1}
.tiles span{font-size:13px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding:12px 16px 10px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mute);gap:3px}
.bars i{display:block;width:100%;max-width:28px;background:var(--tint);border-radius:5px;min-height:3px}
.bars i.zero{background:var(--fill)}
.fig{position:relative;min-height:210px;margin:4px 8px 8px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px}
details>summary::-webkit-details-marker{display:none}
details[open] .chev{transform:rotate(135deg)}
.prow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:15px;border-top:.5px solid var(--sep)}
.prow:first-child{border-top:0}
.note{font-size:15px;line-height:1.4;display:block}
.note.warn{color:var(--danger)}
.ringw{position:relative;flex:none;display:grid;place-items:center}
.ringw svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringw b{font-size:15px}
.empty{padding:28px 18px;text-align:center}
.empty h2{font-size:22px;margin:12px 0 6px}
.empty p{color:var(--mute);margin:0 auto 16px;max-width:36ch;font-size:15px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding:3px 2px calc(2px + env(safe-area-inset-bottom))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:49px;justify-content:center;font-size:10px;font-weight:500;color:var(--mute);text-decoration:none;letter-spacing:0}
.tabs a.on{color:var(--tint)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on svg{stroke-width:2.3}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease}
.sheet[hidden]{display:none}
.box{background:var(--bg);width:min(680px,100%);max-height:94vh;overflow:auto;border-radius:12px 12px 0 0;padding:0 16px calc(28px + env(safe-area-inset-bottom));animation:up .38s cubic-bezier(.2,.9,.25,1);overscroll-behavior:contain}
@media(min-width:700px){.sheet{align-items:center}.box{border-radius:14px}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}
.sh{position:sticky;top:0;z-index:2;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;margin:0 -16px 6px;padding:0 10px;min-height:52px;touch-action:none}
.sh b{font-size:17px;font-weight:600}.sh .lnk:last-child{justify-self:end}.sh .lnk:first-child{justify-self:start}
.as{width:min(440px,100%);padding:0 8px calc(8px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.9,.25,1)}
.asg{background:var(--bar);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px}
.ast{font-size:13px;color:var(--mute);text-align:center;padding:14px 18px;margin:0}
.ast b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
.asb{display:block;width:100%;min-height:57px;border:0;box-shadow:inset 0 .5px 0 var(--sep);background:transparent;color:var(--tint);font-size:19px}
.asg>.asb:first-child{box-shadow:none}
.asb.d{color:var(--danger)}.asb.b{font-weight:600}
.asb:active{background:var(--fill)}
.trophy{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#ffd60a,#ff9f0a);color:#fff;box-shadow:0 8px 20px -8px rgba(255,159,10,.7)}
.trophy svg{width:34px;height:34px;fill:currentColor}
.trophy.sm{width:34px;height:34px;margin:0;flex:none;box-shadow:none}.trophy.sm svg{width:18px;height:18px}
.trophy.soon{background:linear-gradient(140deg,#64d2ff,#0a84ff)}.trophy.end{background:linear-gradient(140deg,#c7c7cc,#8e8e93)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;padding:18px 14px 0;background:linear-gradient(180deg,var(--tintbg),transparent 70%)}
.pcol{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;position:relative}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;flex:none;box-shadow:0 0 0 3px var(--cell)}
.av.sm{width:32px;height:32px;font-size:14px;box-shadow:none}
.p1 .av{width:66px;height:66px;font-size:26px;box-shadow:0 0 0 3px var(--cell),0 0 0 6px #ffd60a}
.p2 .av{box-shadow:0 0 0 3px var(--cell),0 0 0 5px #c7c7cc}.p3 .av{box-shadow:0 0 0 3px var(--cell),0 0 0 5px #d39060}
.pn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;margin-top:6px}
.ps{font-size:15px;color:var(--mute);font-weight:600;white-space:nowrap}.p1 .ps{color:var(--tint);font-size:17px}
.pb{width:100%;margin-top:6px;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:8px;font:800 28px ui-rounded,-apple-system,system-ui,sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.p1 .pb{height:112px;background:linear-gradient(#ffd60a,#e5a400)}.p2 .pb{height:82px;background:linear-gradient(#d8d8dd,#a5a5aa)}.p3 .pb{height:62px;background:linear-gradient(#e6a36c,#b8733f)}
.crown{position:absolute;top:-22px;width:30px;height:30px;fill:#ffd60a;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.wk>div{background:var(--fill);border-radius:12px;padding:8px 10px;position:relative;overflow:hidden}
.wk>div b{display:block;font-size:20px}.wk>div i{position:absolute;left:0;bottom:0;height:4px;background:var(--tint)}
.wk>div.ok{background:rgba(52,199,89,.16)}.wk>div.ok i{background:#34c759}.wk>div.now{box-shadow:inset 0 0 0 2px var(--tint)}
.qadd{display:grid;grid-template-columns:48px 48px minmax(0,1fr) 48px 48px;gap:6px;width:100%;align-items:center}
.qadd button{height:48px;border:0;border-radius:12px;background:var(--fill);font-weight:600;font-size:16px}
.qadd input{border:0;background:transparent;text-align:center;font-size:36px;font-weight:700;width:100%;outline:none}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--ink);padding:11px 20px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:60;font-weight:600;font-size:15px;animation:drop .35s cubic-bezier(.2,.9,.25,1);white-space:nowrap}
/* séance immersive */
.run{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);color-scheme:dark}
.run[hidden]{display:none}
.rtop{display:flex;align-items:center;gap:8px;padding:8px 12px 6px}
.rbtn{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;flex:none}
.rbtn svg{width:20px;height:20px;fill:currentColor}
.rel{flex:1;text-align:center;font-size:17px;font-weight:600;color:rgba(235,235,245,.75)}
.segs{display:flex;gap:3px;padding:2px 16px 0}
.segs span{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}.segs i{display:block;height:100%;background:#ff4f3f;transition:width .4s}
.rbody{flex:1;overflow:auto;padding:18px 22px 8px;display:flex;flex-direction:column;gap:16px;max-width:600px;width:100%;margin:0 auto}
.rbody.mid{justify-content:center;text-align:center}
.rfoot{padding:10px 22px 14px;max-width:600px;width:100%;margin:0 auto;display:grid;gap:10px}
.rk{font-size:15px;color:rgba(235,235,245,.6);margin:0}
.rname{font-size:clamp(34px,10vw,52px);font-weight:800;line-height:1.04;margin:0;letter-spacing:-.02em}
.rbig{font-size:clamp(96px,32vw,160px);font-weight:700;line-height:.9;margin:4px 0;letter-spacing:-.03em}
.rbig small{font-size:.22em;color:rgba(235,235,245,.6);font-weight:600;margin-left:8px;letter-spacing:0}
.rpill{background:rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;font-size:15px}
.rpill b{color:#fff}
.rlist .rpill{display:flex;align-items:center;gap:12px}
.rlist .rpill+.rpill{margin-top:8px}
.stps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stp{background:rgba(255,255,255,.1);border-radius:18px;padding:8px}
.stp>div{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center}
.stp button{height:52px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:28px;font-weight:300;line-height:1}
.stp button:active{background:rgba(255,255,255,.28)}
.stp input{background:transparent;border:0;color:#fff;text-align:center;font-size:32px;font-weight:700;width:100%;outline:none;padding:0}
.stp label{display:block;font-size:13px;color:rgba(235,235,245,.6);text-align:center;margin-top:4px}
.big{min-height:64px;font-size:19px;border-radius:18px}
.btn.dk{background:rgba(255,255,255,.14);color:#fff}
.btn.y{background:var(--yellow);color:#000}
.ring{position:relative;width:min(74vw,300px);aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lbl b{font-size:clamp(60px,19vw,92px);font-weight:700;line-height:1}
.pause{position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;animation:fade .2s}
.pause .btn{width:min(320px,100%)}
.enter{animation:in .42s cubic-bezier(.2,.9,.25,1)}
.pop{animation:pop .5s cubic-bezier(.2,.9,.25,1)}
.pr{display:inline-flex;align-items:center;gap:6px;background:rgba(255,214,10,.16);color:var(--yellow);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;margin:0 6px 6px 0}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.65)}100%{box-shadow:0 0 0 12px rgba(255,59,48,0)}}
.rbtn.mic.on{background:#ff3b30;animation:pulse 1.4s infinite}
.vhint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:rgba(235,235,245,.75);margin:0}.vhint[hidden]{display:none}.vhint svg{width:16px;height:16px;fill:#ff453a}
.heard{font-size:13px;color:rgba(235,235,245,.45);text-align:center;min-height:18px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sw{font-size:24px;color:#fff;margin:0}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{opacity:0;transform:translate(-50%,-20px)}}
@keyframes pop{from{opacity:0;transform:scale(.55)}}
@media(max-width:420px){.mini{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<header class="nav" id="nav"><span id="sync" class="sync">Chargement…</span><b class="ntitle" id="ntitle"></b><span class="nact" id="nact"></span></header>
<main id="view"></main>

  <a href="#planning" data-tab="planning"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Planning</a>

<div id="sheet" class="sheet" hidden><div class="box" id="sheetBox" role="dialog" aria-modal="true"></div></div>
<div id="run" class="run" hidden></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid=()=>Math.random().toString(36).slice(2,9);
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DS=['L','M','M','J','V','S','D'];
const GROUPS=['Haut du corps','Bas du corps','Abdos & dos','Cardio'];
const GSHORT={'Haut du corps':'Haut','Bas du corps':'Bas','Abdos & dos':'Abdos','Cardio':'Cardio'};
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dow=d=>(d.getDay()+6)%7;
const monday=d=>{const m=new Date(d);m.setHours(0,0,0,0);m.setDate(m.getDate()-dow(m));return m};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const pd=s=>new Date(s+'T00:00');
const fmtDate=s=>pd(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const fmtLong=s=>pd(s).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+pad(s%60)};
const r1=x=>Math.round(x*10)/10;
const PLAY='<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>';
const TROPHY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h3v2a4 4 0 01-4 4h-.3A5 5 0 0113 13.9V17h3v3H8v-3h3v-3.1A5 5 0 018.3 11H8a4 4 0 01-4-4V5h3zm0 4H6a2 2 0 002 2zm10 0v2a2 2 0 002-2z"/></svg>';
const CROWN='<svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5z"/></svg>';
const PLUS='<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';

const E=(id,name,group,type='reps')=>({id,name,group,type});
const I=(ex,sets,reps,load,rest)=>({ex,sets,reps,load,rest});
const DEF={
  exercises:[E('pompes','Pompes',GROUPS[0]),E('dips','Dips sur chaise',GROUPS[0]),E('rowing','Rowing haltère',GROUPS[0]),E('dev','Développé épaules haltères',GROUPS[0]),E('curl','Curl biceps',GROUPS[0]),
    E('squat','Squats',GROUPS[1]),E('fente','Fentes alternées',GROUPS[1]),E('pont','Pont fessier',GROUPS[1]),E('rdl','Soulevé de terre jambes tendues',GROUPS[1]),E('chaise','Chaise contre le mur',GROUPS[1],'time'),
    E('gainage','Gainage planche',GROUPS[2],'time'),E('crunch','Crunchs',GROUPS[2]),E('superman','Superman',GROUPS[2]),
    E('mountain','Mountain climbers',GROUPS[3],'time'),E('burpees','Burpees',GROUPS[3]),E('jj','Jumping jacks',GROUPS[3],'time')],
  workouts:[
    {id:'w1',name:'Haut du corps',items:[I('pompes',4,12,0,60),I('rowing',4,10,8,60),I('dev',3,10,6,60),I('dips',3,12,0,60),I('gainage',3,45,0,30)]},
    {id:'w2',name:'Bas du corps',items:[I('squat',4,15,0,60),I('fente',3,12,0,60),I('pont',3,15,0,45),I('rdl',3,12,10,60),I('chaise',3,45,0,45)]},
    {id:'w3',name:'Full body express',items:[I('burpees',3,10,0,30),I('jj',3,40,0,20),I('squat',3,20,0,30),I('pompes',3,10,0,30),I('mountain',3,30,0,30),I('crunch',3,20,0,30)]}],
  plan:{0:['w1'],2:['w2'],4:['w3']},goals:[],history:[]};

let S=null;
try{S=JSON.parse(localStorage.getItem('cadence-v1'))}catch(e){}
if(!S||!Array.isArray(S.exercises))S=JSON.parse(JSON.stringify(DEF));
const norm=()=>{S.plan=S.plan||{};for(let i=0;i<7;i++)if(!Array.isArray(S.plan[i]))S.plan[i]=[];S.workouts=S.workouts||[];S.goals=S.goals||[];S.challenges=S.challenges||[];S.history=(S.history||[]).sort((a,b)=>b.ts-a.ts)};
norm();
const exById=id=>S.exercises.find(e=>e.id===id);
const woById=id=>S.workouts.find(w=>w.id===id);

/* ---------- sauvegarde ---------- */
let db=null,me=null,flushing=false,tmr=null;const dirty=new Set();
const SYNC={ok:['Synchronisé','ok'],local:['Sur cet appareil','ok'],slow:['Connexion lente…',''],err:['Sauvegarde en attente','err'],full:['Stockage plein','err']};
function setSync(k){const p=$('#sync');p.textContent=SYNC[k][0];p.className='sync '+SYNC[k][1]}
function save(months){dirty.add('config');(months||[]).forEach(m=>dirty.add('h-'+m));
  try{localStorage.setItem('cadence-v1',JSON.stringify(S))}catch(e){}
  clearTimeout(tmr);tmr=setTimeout(flush,700)}
async function flush(){if(!db||!me||flushing)return;flushing=true;
  const col=db.collection('data/users/'+me),keys=[...dirty];dirty.clear();
  try{for(const k of keys){
      if(k==='config')await col.doc('config').set({exercises:S.exercises,workouts:S.workouts,plan:S.plan,goals:S.goals,challenges:S.challenges,pseudo:S.pseudo||'',v:1});
      else{const m=k.slice(2),l=S.history.filter(h=>h.date.startsWith(m));
        if(l.length)await col.doc(k).set({sessions:l});else await col.doc(k).delete()}}
    setSync('ok')}
  catch(e){keys.forEach(k=>dirty.add(k));setSync(e&&e.code==='quota_exceeded'?'full':'err')}
  flushing=false;if(dirty.size){clearTimeout(tmr);tmr=setTimeout(flush,2000)}}
async function connect(){
  if(!window.claude||!claude.use){setSync('local');return}
  const slow=setTimeout(()=>setSync('slow'),10000);
  try{const [u,d]=await Promise.all([claude.use('user'),claude.use('db')]);
    const id=u?await u.id():null;
    if(!d||!id){clearTimeout(slow);setSync('local');return}
    db=d;me=id;
    const snap=await d.collection('data/users/'+id).get();clearTimeout(slow);
    let cfg=null;const hist=[];
    snap.docs.forEach(doc=>{const v=doc.data()||{};if(doc.id==='config')cfg=v;else if(doc.id.startsWith('h-')&&Array.isArray(v.sessions))hist.push(...v.sessions)});
    if(cfg&&Array.isArray(cfg.exercises)){S={exercises:cfg.exercises,workouts:cfg.workouts||[],plan:cfg.plan||{},goals:cfg.goals||[],challenges:cfg.challenges||[],pseudo:cfg.pseudo||'',history:hist};norm();
      try{localStorage.setItem('cadence-v1',JSON.stringify(S))}catch(e){}
      if($('#run').hidden&&$('#sheet').hidden)render();setSync('ok')}
    else{save([...new Set(S.history.map(h=>h.date.slice(0,7)))]);setSync('ok')}}
  catch(e){clearTimeout(slow);setSync('local')}}

/* ---------- helpers ---------- */
const estMin=w=>Math.max(1,Math.round(w.items.reduce((t,it)=>{const ex=exById(it.ex);const work=ex&&ex.type==='time'?+it.reps:40;return t+it.sets*(work+(+it.rest||0))},0)/60));
const unit=ex=>ex&&ex.type==='time'?'s':'reps';
const names=w=>w.items.map(it=>exById(it.ex)).filter(Boolean).map(e=>e.name);
function lastFor(exId){for(const h of S.history){const e=h.entries.find(x=>x.ex===exId&&x.sets.length);if(e)return{date:h.date,sets:e.sets}}return null}
const setTxt=(s,ex)=>s.reps+(ex&&ex.type==='time'?' s':'')+(s.load?' × '+s.load+' kg':'');
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const lt=(t,sub)=>`<div class="lt"><h1>${esc(t)}</h1>${sub?`<p>${sub}</p>`:'<p></p>'}</div>`;
function ringSvg(frac,stroke,color){const r=50-stroke/2,C=2*Math.PI*r;return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" style="stroke:var(--fill)" stroke-width="${stroke}"/><circle cx="50" cy="50" r="${r}" fill="none" style="stroke:${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.max(0,Math.min(1,frac)))}"/></svg>`}

/* ---------- objectifs : calcul ---------- */
const WK=7*864e5;
function goalHist(g){return S.history.filter(h=>h.goalId===g.id).sort((a,b)=>a.ts-b.ts)}
function goalBase(g){const hs=goalHist(g);for(let i=hs.length-1;i>=0;i--){const e=hs[i].entries.find(x=>x.ex===g.ex);
    if(e&&e.sets.length)return{sets:e.sets.length,reps:Math.min(...e.sets.map(s=>+s.reps||0)),date:hs[i].date,real:true}}
  return{sets:+g.curSets||1,reps:+g.curReps||1,date:null,real:false}}
function goalPlan(g){
  const base=goalBase(g),today=pd(dk(new Date())),end=pd(g.end),startMon=monday(pd(g.start));
  let d=base.date?addD(pd(base.date),1):pd(g.start);if(d<today)d=today;
  const isDeload=x=>!!g.deload&&Math.round((monday(x)-startMon)/WK)%4===3;
  const dates=[];for(let x=new Date(d);x<=end&&dates.length<500;x=addD(x,1))if(g.days.includes(dow(x)))dates.push(new Date(x));
  const sess=dates.map((x,i)=>({date:dk(x),deload:i<dates.length-1&&isDeload(x)}));
  const M=sess.filter(s=>!s.deload).length,T=+g.tReps,sT=+g.tSets,B=Math.min(base.reps,T),sB=base.sets;
  let j=0,prev={sets:sB,reps:B};
  sess.forEach(s=>{if(s.deload){s.sets=prev.sets;s.reps=Math.max(1,Math.round(prev.reps*.8));return}
    j++;const f=j/M;s.sets=sB>=sT?sT:Math.round(sB+(sT-sB)*f);s.reps=Math.max(prev.reps,Math.round(B+(T-B)*f));
    if(j===M){s.sets=sT;s.reps=T;s.test=true}prev=s});
  const reached=base.real&&base.reps>=T&&base.sets>=sT;
  const ex=exById(g.ex),step=ex&&ex.type==='time'?5:1.5,inc=M?(T-B)/M:Infinity;
  const level=reached?'done':!M?'late':inc<=step?'ok':inc<=step*1.7?'hard':'tooHard';
  let realistic=null;
  if(level==='hard'||level==='tooHard'||level==='late'){const need=Math.ceil((T-B)/step);let c=0,x=new Date(d),k=0;
    for(;k<2000&&c<need;k++,x=addD(x,1))if(g.days.includes(dow(x))&&!isDeload(x))c++;
    if(c>=need&&need>0)realistic=dk(addD(x,-1))}
  return{base,sess,M,inc,level,realistic,reached,hist:goalHist(g),step}}
function goalMsg(g,p,u){const per=r1(p.inc)+u;
  if(p.level==='done')return `<span class="note"><b>Objectif atteint, bravo !</b> Fixe-toi un nouveau cap, plus haut.</span>`;
  const fix=p.realistic?` Date réaliste : <b>${esc(fmtLong(p.realistic))}</b>.`:' Ajoute des jours ou repousse la date.';
  const btn=p.realistic&&g.id!=='__preview'?`<button class="btn t w" data-act="gdate" data-id="${esc(g.id)}" data-v="${p.realistic}" style="margin-top:10px;min-height:44px">Passer au ${esc(fmtLong(p.realistic))}</button>`:'';
  if(p.level==='late')return `<span class="note warn">Aucune séance possible avant l’échéance.${fix}</span>${btn}`;
  if(p.level==='ok')return `<span class="note">Rythme réaliste : environ <b>+${per} par série</b> à chaque séance.</span>`;
  if(p.level==='hard')return `<span class="note">Ambitieux : <b>+${per} par série</b> à chaque séance, sans marge.${fix}</span>${btn}`;
  return `<span class="note warn">Trop rapide : <b>+${per} par série</b> à chaque séance, risque de stagner ou de te blesser.${fix}</span>${btn}`}

/* ---------- vues ---------- */
function vToday(){
  const now=new Date(),di=dow(now),today=dk(now),mon=monday(now);
  const planned=S.plan[di].map(woById).filter(Boolean);
  const gToday=S.goals.map(g=>({g,ex:exById(g.ex),p:goalPlan(g)})).filter(o=>o.ex&&!o.p.reached&&((o.p.sess[0]&&o.p.sess[0].date===today)||o.p.hist.some(h=>h.date===today)));
  const doneW=id=>S.history.some(h=>h.date===today&&h.workoutId===id);
  const feats=gToday.map(({g,ex,p})=>{const u=ex.type==='time'?' s':'',h=p.hist.find(h=>h.date===today),s=p.sess[0];
      if(h)return `<div class="feat goal done"><p class="k">✓ Objectif ${g.tSets} × ${g.tReps}${u}</p><h3 class="rnd">${esc(h.entries[0].sets.map(x=>x.reps).join(' · '))}${u}</h3><p class="k">${esc(ex.name)} · prochaine : ${s?s.sets+' × '+s.reps+u+', '+esc(fmtDate(s.date)):'—'}</p></div>`;
      return `<div class="feat goal"><p class="k">Objectif ${g.tSets} × ${g.tReps}${u}${s.test?' · test final':s.deload?' · allégée':''}</p><h3 class="rnd">${s.sets} × ${s.reps}${u}</h3><p class="k">${esc(ex.name)} · repos ${g.rest} s</p><button class="go" data-act="startgoal" data-id="${esc(g.id)}" aria-label="Démarrer l’objectif ${esc(ex.name)}">${PLAY}</button></div>`})
    .concat(planned.map(w=>{const d=doneW(w.id),n=names(w);return `<div class="feat ${d?'done':''}"><p class="k">${d?'✓ Faite aujourd’hui':'Séance · ≈ '+estMin(w)+' min'}</p><h3>${esc(w.name)}</h3><p class="k">${w.items.length} exercices · ${esc(n.slice(0,3).join(', '))}${n.length>3?'…':''}</p><button class="go" data-act="start" data-id="${esc(w.id)}" aria-label="Démarrer ${esc(w.name)}">${PLAY}</button></div>`})).join('');
  const strip='<div class="group"><div class="week">'+DS.map((l,i)=>{const d=addD(mon,i),k=dk(d);const done=S.history.some(h=>h.date===k),pl=S.plan[i].length||S.goals.some(g=>g.days.includes(i)&&k>=g.start&&k<=g.end);
    return `<div><span class="wd">${l}</span><span class="wn rnd ${k===today?'today':''}">${d.getDate()}</span><span class="wdot ${done?'done':pl?'plan':''}"></span></div>`}).join('')+`</div></div>`;
  const last=S.history[0],others=S.workouts.filter(w=>!planned.includes(w));
  const wk=S.history.filter(h=>h.date>=dk(mon)).length;
  return lt('Aujourd’hui',esc(cap(now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))))+`<div class="cols"><div>
    <div class="stack">${feats||`<div class="group"><div class="empty"><h2>Jour de repos</h2><p>Rien de prévu aujourd’hui. Récupère, ou lance une séance ci-dessous si l’envie te prend.</p></div></div>`}</div>
    <p class="sec">Cette semaine · ${wk} séance${wk>1?'s':''} faite${wk>1?'s':''}</p>${strip}
  </div><div>
    ${last?`<p class="sec">Dernière séance</p><div class="group"><a class="cell" href="#historique"><span class="sp">${esc(last.name)}<span class="sub">${esc(fmtDate(last.date))} · ${last.dur?last.dur+' min':'ajout rapide'} · ${last.entries.reduce((t,e)=>t+e.sets.length,0)} séries</span></span><span class="chev"></span></a></div>`:''}
    ${FB_CONFIG&&S.challenges.some(c=>chStatus(c).k==='live')?`<p class="sec">Défis en cours</p><div class="group">${S.challenges.filter(c=>chStatus(c).k==='live').map(c=>{const r=chRanks[c.code];return `<button class="cell" data-act="chopen" data-id="${esc(c.code)}"><span class="trophy sm">${TROPHY}</span><span class="sp">${esc(c.name)}<span class="sub">${esc(chStatus(c).txt)}</span></span>${r?`<span class="val num">${r.rank}<sup>${r.rank===1?'er':'e'}</sup>/${r.n}</span>`:''}<span class="chev"></span></button>`}).join('')}</div>`:''}
    ${others.length?`<p class="sec">Lancer une autre séance</p><div class="group">${others.map(w=>`<div class="cell"><span class="sp">${esc(w.name)}<span class="sub">≈ ${estMin(w)} min · ${w.items.length} exercices</span></span><button class="play" data-act="start" data-id="${esc(w.id)}" aria-label="Démarrer ${esc(w.name)}">${PLAY}</button></div>`).join('')}</div>`:''}
  </div></div>`}

function goalCard(g){const ex=exById(g.ex);if(!ex)return'';const p=goalPlan(g),u=ex.type==='time'?' s':'',today=dk(new Date());
  const frac=p.reached?1:Math.max(0,Math.min(1,(p.base.reps-g.curReps)/Math.max(1,g.tReps-g.curReps)));
  const next=p.sess[0],doneToday=p.hist.some(h=>h.date===today);
  const rows=p.hist.map(h=>{const e=h.entries.find(x=>x.ex===g.ex);return `<div class="prow"><span>✓ ${esc(fmtDate(h.date))}</span><b class="num">${e?esc(e.sets.map(s=>s.reps).join(' · ')):''}${u}</b></div>`})
    .concat(p.sess.map(s=>`<div class="prow"><span>${s.date===today?'<b>Aujourd’hui</b>':esc(fmtDate(s.date))}${s.test?' · <b style="color:var(--tint)">test final</b>':s.deload?' · <span style="color:var(--mute)">allégée</span>':''}</span><b class="num">${s.sets} × ${s.reps}${u}</b></div>`)).join('');
  return `<div class="group">
  <div class="cell" style="padding:14px 16px"><div class="ringw" style="width:62px;height:62px">${ringSvg(frac,11,'var(--tint)')}<b class="num">${Math.round(frac*100)}%</b></div>
    <span class="sp"><b style="font-size:20px;display:block;line-height:1.2">${g.tSets} × ${g.tReps}${u} ${esc(ex.name)}</b><span class="sub">D’ici le ${esc(fmtLong(g.end))} · ${esc(g.days.map(i=>DAYS[i].slice(0,3)).join(', '))}</span></span></div>
  <div class="cell"><span class="sp">Niveau actuel</span><span class="val num">${p.base.sets} × ${p.base.reps}${u}</span></div>
  <div class="cell"><span class="sp">Séances restantes</span><span class="val num">${p.sess.length}</span></div>
  <div class="cell" style="display:block">${goalMsg(g,p,u)}</div>
  ${next&&!p.reached?`<div class="cell" style="display:block;padding:14px 16px"><span class="sub">${doneToday?'✓ Séance du jour faite · ':''}${next.date===today?'Aujourd’hui':'Prochaine séance · '+esc(fmtDate(next.date))}${next.test?' · test final':next.deload?' · semaine allégée':''}</span>

function drawChart(){const s=$('#chart');if(!s)return;const r=series();if(!r||!r.pts.length)return;
  const W=s.clientWidth,H=s.clientHeight,P={l:34,r:12,t:14,b:24},pts=r.pts,first=pts[0],lastP=pts[pts.length-1];
  $('#chartlbl').textContent=r.lbl+(pts.length>1?' · '+(lastP.v-first.v>=0?'+':'')+r1(lastP.v-first.v)+' depuis le début':'');
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),lo=mn===mx?mn-1:mn,hi=mn===mx?mx+1:mx;
  const x=i=>pts.length===1?W/2:P.l+i*(W-P.l-P.r)/(pts.length-1),y=v=>P.t+(1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p.v).toFixed(1)).join('');
  const area=path+`L${x(pts.length-1).toFixed(1)},${H-P.b}L${x(0).toFixed(1)},${H-P.b}Z`;
  let g=`<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tint);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--tint);stop-opacity:0"/></linearGradient></defs>
  <line x1="${P.l}" x2="${W-P.r}" y1="${y(hi)}" y2="${y(hi)}" style="stroke:var(--sep)"/><line x1="${P.l}" x2="${W-P.r}" y1="${y(lo)}" y2="${y(lo)}" style="stroke:var(--sep)"/>
  <text x="${P.l-6}" y="${y(hi)+4}" text-anchor="end" font-size="12" style="fill:var(--mute)">${Math.round(hi)}</text><text x="${P.l-6}" y="${y(lo)+4}" text-anchor="end" font-size="12" style="fill:var(--mute)">${Math.round(lo)}</text>
  ${pts.length>1?`<path d="${area}" fill="url(#ga)"/>`:''}<path d="${path}" fill="none" style="stroke:var(--tint)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`+pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5.5:3.5}" style="fill:var(--tint);stroke:var(--cell)" stroke-width="2"/>`).join('');
  if(W>380||pts.length<6)g+=`<text x="${x(0)}" y="${H-5}" font-size="12" style="fill:var(--mute)" text-anchor="${pts.length===1?'middle':'start'}">${esc(fmtDate(first.d))}</text>`+(pts.length>1?`<text x="${x(pts.length-1)}" y="${H-5}" font-size="12" style="fill:var(--mute)" text-anchor="end">${esc(fmtDate(lastP.d))}</text>`:'');
  s.innerHTML=g}

    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){micWant=false;toast('Micro non autorisé sur cette page')}};
    rec.onend=()=>{rec=null;micOn=false;updMic();if(micWant&&R){try{srStart()}catch(e){}}};
    rec.start();micOn=true;updMic()}catch(e){micWant=false;toast('Reconnaissance vocale indisponible')}}
function micStart(){micWant=true;
  if(dict){dict.start().catch(e=>{micWant=false;const c=e&&e.code;if(c==='not_granted')toast('Micro refusé : touche le micro pour réessayer plus tard');else if(c==='unavailable')toast('Dictée indisponible ici');else if(c!=='stopped')toast('Le micro n’a pas pu démarrer')})}
  else if(SR)srStart()}
function micStop(){micWant=false;if(dict&&dict.active())dict.stop().catch(()=>{});if(rec){try{rec.stop()}catch(e){}}micOn=false;updMic()}
if(window.claude&&claude.use)claude.use('dictation').then(d=>{if(!d)return;dict=d;
  d.onPartial(({text})=>hear(text,false));d.onFinal(({text})=>hear(text,true));
  d.onState(({state,reason})=>{micOn=state!=='idle';
    if(state==='idle'){if(reason==='hidden'&&micWant&&R)toast('Touche le micro pour réactiver la voix');micWant=false}
    updMic()});if(R)draw()}).catch(()=>{});
function startSet(){audio();const it=curIt(),ex=curEx();
  if(ex.type==='time'){R.wlen=+it.reps;R.wend=nowT()+it.reps*1000;R.wstart=nowT()}else{R.act=true;R.actT0=nowT()}
  R.lastSec=99;beep('go');vib(40);draw()}


/* ---------- données : export / import / partage ---------- */
function dataSec(){return `<p class="sec">Mes données · enregistrées sur cet appareil</p><div class="group">
  <button class="cell" data-act="export"><span class="sp" style="color:var(--tint)">Exporter une sauvegarde<span class="sub">Un fichier à garder dans Fichiers, iCloud ou à t’envoyer par mail</span></span></button>
  <label class="cell" style="cursor:pointer"><span class="sp" style="color:var(--tint)">Restaurer une sauvegarde<span class="sub">Remplace les données de cet appareil</span></span><input type="file" id="imp" accept=".json,application/json" style="position:absolute;inset:0;opacity:0;width:100%;cursor:pointer" aria-label="Choisir un fichier de sauvegarde"></label>
  <button class="cell" data-act="shareapp"><span class="sp" style="color:var(--tint)">Partager l’app<span class="sub">Chaque personne aura ses propres données, sur son téléphone</span></span></button></div>
  <p class="sec" style="margin-top:8px">Pense à exporter de temps en temps : supprimer l’app de l’écran d’accueil efface aussi ses données.</p>`}
async function exportData(){const json=JSON.stringify({app:'cadence',v:1,date:new Date().toISOString(),data:S});const name='cadence-sauvegarde-'+dk(new Date())+'.json';
  if(window.claude&&claude.use){try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:json});toast('Sauvegarde enregistrée');return}}catch(e){toast('Export annulé');return}}
  try{const f=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sauvegarde Cadence'});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Sauvegarde téléchargée')}
  catch(e){try{await navigator.clipboard.writeText(json);toast('Sauvegarde copiée')}catch(e2){toast('Export impossible ici')}}}
function importFile(file){const r=new FileReader();r.onload=()=>{let d=null;try{const j=JSON.parse(r.result);d=j&&j.data?j.data:j}catch(e){}
  if(!d||!Array.isArray(d.exercises)){toast('Ce fichier n’est pas une sauvegarde Cadence');return}
  const n=(d.history||[]).length;
  actionSheet('Restaurer cette sauvegarde ?',`${n} séance${n>1?'s':''} et ${(d.goals||[]).length} objectif(s). Les données actuelles de cet appareil seront remplacées.`,[{label:'Restaurer',d:1,fn:()=>{
    S={exercises:d.exercises,workouts:d.workouts||[],plan:d.plan||{},goals:d.goals||[],challenges:d.challenges||[],pseudo:d.pseudo||'',history:d.history||[]};norm();chSyncAll();save([...new Set(S.history.map(h=>h.date.slice(0,7)))]);render();toast('Sauvegarde restaurée')}}])};r.readAsText(file)}
async function shareApp(){const url=location.href.split('#')[0];
  try{if(navigator.share){await navigator.share({title:'Cadence',text:'Mon app pour planifier et suivre mes workouts à la maison',url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Lien copié')}catch(e){toast(url)}}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='start')start(id);
  else if(a==='startgoal')startGoal(id);
  else if(a==='close')closeSheet();
  else if(a==='as'){const o=AS[+b.dataset.i];closeSheet();o&&o.fn&&o.fn()}
  else if(a==='unplan'){S.plan[b.dataset.d].splice(+b.dataset.j,1);save();render()}
  else if(a==='newwo')editWo(null);
  else if(a==='editwo')editWo(id);
  else if(a==='addit'){if(!S.exercises.length){toast('Ajoute d’abord un exercice');return}draft.items.push(I(S.exercises[0].id,3,10,0,60));drawEditor();box.scrollTop=box.scrollHeight}
  else if(a==='rmit'){draft.items.splice(+b.dataset.i,1);drawEditor()}
  else if(a==='mv'){const i=+b.dataset.i,j=i+ +b.dataset.dir;if(j<0||j>=draft.items.length)return;[draft.items[i],draft.items[j]]=[draft.items[j],draft.items[i]];drawEditor()}
  else if(a==='savewo'){const d=draft;d.name=d.name.trim()||'Séance sans nom';d.items.forEach(it=>{it.sets=Math.max(1,it.sets|0);it.reps=Math.max(1,it.reps|0)});const isNew=d._new;delete d._new;
    const i=S.workouts.findIndex(w=>w.id===d.id);if(i>=0)S.workouts[i]=d;else S.workouts.push(d);save();closeSheet();render();toast(isNew?'Séance créée':'Séance enregistrée')}
  else if(a==='delwo'){const wid=draft.id,name=draft.name;actionSheet('Supprimer « '+name+' » ?','Elle sera retirée de ton planning. Ton historique est conservé.',[{label:'Supprimer la séance',d:1,fn:()=>{S.workouts=S.workouts.filter(w=>w.id!==wid);for(let i=0;i<7;i++)S.plan[i]=S.plan[i].filter(x=>x!==wid);save();render();toast('Séance supprimée')}}])}
  else if(a==='newgoal'){if(!S.exercises.length){toast('Ajoute d’abord un exercice');return}editGoal(null)}
  else if(a==='editgoal')editGoal(id);
  else if(a==='gday'){const i=+b.dataset.i,ds=gdraft.days;gdraft.days=ds.includes(i)?ds.filter(x=>x!==i):[...ds,i].sort();drawGoalEditor()}
  else if(a==='gdate'){const g=S.goals.find(x=>x.id===id);if(!g)return;g.end=b.dataset.v;save();render();toast('Nouvelle date : '+fmtLong(g.end))}
  else if(a==='savegoal'){const g=gdraft;if(!g.days.length){toast('Choisis au moins un jour');return}if(!(g.tReps>0&&g.tSets>0&&g.curReps>0&&g.curSets>0)){toast('Complète les nombres');return}
    if(!g.end||g.end<=dk(new Date())){toast('Choisis une date future');return}
    const isNew=g._new;delete g._new;const i=S.goals.findIndex(x=>x.id===g.id);if(i>=0)S.goals[i]=g;else S.goals.push(g);save();closeSheet();
    if(cur!=='objectifs')location.hash='objectifs';else render();toast(isNew?'Programme créé':'Objectif mis à jour')}
  else if(a==='delgoal'){actionSheet('Supprimer cet objectif ?','Son programme disparaît. Les séances déjà faites restent dans ton historique.',[{label:'Supprimer l’objectif',d:1,fn:()=>{S.goals=S.goals.filter(x=>x.id!==id);save();render()}}])}
  else if(a==='exf'){exFilter=b.dataset.g;render()}
  else if(a==='newex')newEx();
  else if(a==='saveex'){const n=$('#exn').value.trim();if(!n){toast('Donne un nom à l’exercice');return}const g=$('#exg').value;S.exercises.push(E('x'+nid(),n,g,$('#ext').value));exFilter='Tous';save();closeSheet();render();toast('« '+n+' » ajouté')}
  else if(a==='exmenu'){const ex=exById(id);if(!ex)return;const used=S.workouts.filter(w=>w.items.some(it=>it.ex===id)).length;
    actionSheet(ex.name,used?'Utilisé dans '+used+' séance'+(used>1?'s':'')+'. Ton historique est toujours conservé.':'Ton historique est toujours conservé.',[{label:'Supprimer l’exercice',d:1,fn:()=>{S.exercises=S.exercises.filter(x=>x.id!==id);S.workouts.forEach(w=>w.items=w.items.filter(it=>it.ex!==id));S.goals=S.goals.filter(g=>g.ex!==id);save();render();toast('Exercice supprimé')}}])}
  else if(a==='delh'){const h=S.history.find(x=>x.id===id);actionSheet('Supprimer cette séance ?',h.name+' du '+fmtDate(h.date)+'. Action définitive.',[{label:'Supprimer',d:1,fn:()=>{S.history=S.history.filter(x=>x.id!==id);save([h.date.slice(0,7)]);render()}}])}
  else if(a==='begin'){if(micAvail()&&vcPref&&!micOn)micStart();begin()}
  else if(a==='mic'){micOn||micWant?micStop():micStart()}
  else if(a==='go'){startSet()}
  else if(a==='valid'){audio();validSet()}
  else if(a==='skip')next();
  else if(a==='rest'){R.end+=+b.dataset.s*1000;R.restLen=Math.max(R.restLen,(R.end-nowT())/1000);R.lastSec=99;frame()}

  else if(a==='stp'){const f=b.dataset.f,st=f==='load'?.5:1;R.cur[f]=Math.max(0,Math.round(((+R.cur[f]||0)+st*+b.dataset.d)*2)/2);const inp=$('#st-'+f);if(inp)inp.value=R.cur[f];vib(10)}
  else if(a==='addload'){R.showLoad=true;draw()}
  else if(a==='pause')togglePause();
  else if(a==='sound'){sound=!sound;try{localStorage.setItem('cadence-sound',sound?'1':'0')}catch(e){}if(!sound)try{speechSynthesis.cancel()}catch(e){}else audio();draw()}
  else if(a==='quit'){if(!R)return;if(R.phase==='intro'||R.phase==='done'){closeRun();return}
    if(!R.paused)togglePause();
    actionSheet('Arrêter la séance ?','Tu peux garder les séries déjà validées.',[{label:'Terminer et enregistrer',b:1,fn:()=>finish()},{label:'Abandonner sans enregistrer',d:1,fn:()=>closeRun()}])}
  else if(a==='closerun')closeRun();
  else if(a==='go2')location.hash=b.dataset.h;
  else if(a==='newch'){if(!FB_CONFIG){toast('Les défis ne sont pas encore activés');return}if(!S.exercises.length){toast('Ajoute d’abord un exercice');return}newCh()}
  else if(a==='cdtype'){cdraft.type=b.dataset.t;drawCh()}
  else if(a==='chcreate')chCreate(b);
  else if(a==='chcode'){if(!FB_CONFIG){toast('Les défis ne sont pas encore activés');return}chCodeSheet()}
  else if(a==='chgo'){const v=$('#chc');chJoinPrompt(v?v.value:'')}
  else if(a==='chjoin')chJoin();
  else if(a==='chopen')chOpen(id);
  else if(a==='chinvite')chInvite(id);
  else if(a==='chadd')chAddSheet(id);
  else if(a==='chsave')chSaveQuick();
  else if(a==='qd'){const i=$('#qv');i.value=Math.max(0,(+i.value||0)+ +b.dataset.d)}
  else if(a==='chmax'){const c=chById(id);if(!c)return;closeSheet();const sc=chScore(c);startW({id:'ch-'+c.code,name:'Défi · '+c.name,items:[I(c.exId,1,Math.max(1,sc.best+1||10),0,0)]},null)}
  else if(a==='chleave'){const c=chById(id);if(!c)return;actionSheet('Quitter « '+c.name+' » ?','Tu disparais du classement. Ton historique est conservé.',[{label:'Quitter le défi',d:1,fn:()=>{S.challenges=S.challenges.filter(x=>x.code!==c.code);save();render();fb().then(({uid,fs})=>fs.collection('challenges').doc(c.code).collection('players').doc(uid).delete()).catch(()=>{})}}])}
  else if(a==='export')exportData();
  else if(a==='shareapp')shareApp();
});
document.addEventListener('input',e=>{const t=e.target;
  if(R&&t.id&&t.id.startsWith('st-'))R.cur[t.id.slice(3)]=+t.value||0;
  else if(t.id==='exq'){const q=t.value.trim().toLowerCase();let any=false;
    document.querySelectorAll('[data-act=exmenu]').forEach(r=>{const m=!q||r.dataset.name.includes(q);r.hidden=!m;r.style.display=m?'':'none';if(m)any=true});
    document.querySelectorAll('.exsec').forEach(s=>{s.style.display=[...s.querySelectorAll('[data-act=exmenu]')].some(r=>r.style.display!=='none')?'':'none'});
    $('#exnone').hidden=any}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.act;
  if(t.id==='imp'&&t.files&&t.files[0]){importFile(t.files[0]);t.value='';return}
  if(t.id==='vcp'){vcPref=t.checked;try{localStorage.setItem('cadence-voicecmd',vcPref?'1':'0')}catch(e){}if(!vcPref)micStop();return}
  if(a==='plan-add'&&t.value){const d=t.dataset.d;if(!S.plan[d].includes(t.value)){S.plan[d].push(t.value);save()}render();toast('Ajoutée le '+DAYS[d].toLowerCase())}
  else if(a==='progex'){progEx=t.value;drawChart()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  else if(R&&$('#sheet').hidden&&e.key===' '&&e.target.tagName!=='INPUT'){e.preventDefault();if(R.phase==='work')validSet();else if(R.phase==='rest')next();else if(R.phase==='intro')begin()}});
document.addEventListener('visibilitychange',()=>{if(R&&!document.hidden&&R.phase!=='done'&&R.phase!=='intro')lockOn()});
addEventListener('hashchange',route);
route();setSync('local');connect();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.claude){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
}
</script>
